<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rmobile シフト作成アプリ</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <div style="max-width:720px;margin:80px auto;padding:24px;font-family:sans-serif;text-align:center;">
        シフト作成アプリを読み込んでいます…
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script>
      (() => {
        const app = document.getElementById("app");

        window.addEventListener("error", event => {
          if (!app || app.dataset.ready === "true") return;

          app.innerHTML = `
            <div style="max-width:720px;margin:60px auto;padding:24px;border:1px solid #f3b4b4;border-radius:14px;background:#fff5f5;font-family:sans-serif;">
              <h2 style="margin-top:0;color:#b42318;">アプリを読み込めませんでした</h2>
              <p><strong>app.js</strong> と <strong>styles.css</strong> が、index.htmlと同じ場所にあるか確認してください。</p>
              <p style="color:#667085;font-size:14px;">確認後、Ctrl＋F5で更新してください。</p>
            </div>
          `;
        });

        const script = document.createElement("script");
        script.src = `./app.js?v=20260728-1`;
        script.onload = () => {
          app.dataset.ready = "true";
        };
        script.onerror = () => {
          window.dispatchEvent(new ErrorEvent("error", {
            message: "app.jsの読み込みに失敗しました"
          }));
        };
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
